services:
  telegram-app:
    image: kevenlemon/telegram-ops:latest
    restart: unless-stopped
    command: ["python", "run_server.py"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./telegram-ops/.env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      - ./telegram-ops:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
