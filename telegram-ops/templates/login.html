{% extends "base.html" %}
{% block content %}
<section class="card" style="max-width: 560px;">
  <div class="card-head"><div><h2>验证登录：{{ account.name }}</h2><span class="muted">验证码由 Telegram 官方账号发送，请填写最新一条。</span></div></div>
  {% if error %}<div class="banner error">{{ error }}</div>{% endif %}
  <form method="post" action="/accounts/{{ account.id }}/verify">
    <label>验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
    <label>两步验证密码<input name="password" type="password" autocomplete="current-password"><span class="hint">账号未开启两步验证时留空。</span></label>
    <div class="form-actions"><button type="submit">完成登录</button><a class="button secondary" href="/accounts">返回账户列表</a></div>
  </form>
</section>
{% endblock %}
